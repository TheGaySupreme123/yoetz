        - generic [ref=e78]: Semantic review, recommended
        - paragraph [ref=e79]: "The setup we recommend. A reviewer model acts like a mini agent alongside yours: it reads a bounded packet built from the ledger, never your repository, challenges the work, and your agent answers with evidence. Deterministic checks still run underneath and are never erased. That is the reviewer you see challenging the agent in the session above."
