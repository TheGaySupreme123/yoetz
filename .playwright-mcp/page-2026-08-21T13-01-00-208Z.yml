    - generic [ref=e130]:
      - generic [ref=e131]:
        - generic [ref=e132]: Semantic review, recommended
        - paragraph [ref=e133]: "The setup we recommend. A reviewer model acts like a mini agent alongside yours: it reads a bounded packet built from the ledger, never your repository, challenges the work, and your agent answers with evidence. Deterministic checks still run underneath and are never erased. That is the reviewer you see challenging the agent in the session above."
      - generic [ref=e134]:
        - generic [ref=e135]: Deterministic only, if you prefer
        - paragraph [ref=e136]: "Works with nothing configured and nothing leaving your machine: versioned policy packs check the recorded ledger and return findings with an exact coverage vector. Less thorough than semantic review, since it can only catch what rules can catch. It runs first in every check, whichever mode you pick."
