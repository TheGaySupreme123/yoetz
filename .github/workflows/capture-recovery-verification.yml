name: Capture recovery verification

on:
  push:
    branches: [codex/fix-695-capture-recovery]
    paths: [.github/workflows/capture-recovery-verification.yml]

permissions:
  contents: write

concurrency:
  group: capture-recovery-verification-695
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify-exact-product-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: '1'
      PYTHONUTF8: '1'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout verification revision without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Reconstruct and commit exact locally tested product tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ddf362cfb7c3bb84dc688e7b01a089ef7d86fdc3
          export REPORT_DIR="${RUNNER_TEMP}/yoetz-695-report"
          mkdir -p "$REPORT_DIR"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          parts = sorted(Path('.github/695-patch').glob('part-*'))
          assert len(parts) == 10
          patch = gzip.decompress(b''.join(path.read_bytes() for path in parts))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '0cd058a3b1e4729170d77e75e818ec8d9fe31735369ff2d422361472895b0abf', digest
          Path(os.environ['REPORT_DIR'], 'product.patch').write_bytes(patch)
          PY
          git apply --check "$REPORT_DIR/product.patch"
          git apply --index "$REPORT_DIR/product.patch"
          git rm -r .github/695-patch .github/workflows/capture-recovery-verification.yml
          git diff --cached --check
          test "$(git write-tree)" = 92e8d9df1c4cb0c8c4118d83ec4525d994eeb6ea
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit \
            -m 'fix(observation): recover capture inventory without admitted input' \
            -m 'Refs #695. Independently recover complete service-owned inventory without weakening atomic admission. Includes real catalog, ledger and encrypted-readback regressions. The separate local-loss-to-check projection requirement and native vendor acceptance remain open. Implemented by GPT-6 Astra Pro in ChatGPT with local container verification.'
          git log -1 --format='commit=%H%ntree=%T%nsubject=%s' | tee "$REPORT_DIR/identity.txt"
          git diff --stat c2db3120fc0096b904111bc9e7ab4287f6b84508 HEAD >> "$REPORT_DIR/identity.txt"
      - name: Install repository-pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: '0.11.29'
          python-version: '3.14.6'
          enable-cache: false
      - name: Install locked development dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Install repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.0'
      - name: Install locked type-checker without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Style types resources and public boundary
        run: |
          set -euo pipefail
          {
            uv --version
            uv run --locked python --version
            node --version
            uv run --locked ruff format --check .
            uv run --locked ruff check .
            node_modules/.bin/pyright
            uv run --locked python scripts/sync_resource_ripple.py --check
            uv run --locked python scripts/scan_public_boundary.py --source-tree .
            git diff --check
          } 2>&1 | tee "$REPORT_DIR/static-checks.log"
      - name: Shared admission coordinator catalog and recovery regressions
        run: |
          set -euo pipefail
          uv run --locked pytest \
            tests/unit/adapters/test_observation_*.py \
            tests/unit/application/test_observation_*.py \
            tests/unit/application/test_outbox_selection.py \
            tests/unit/service/test_observation_capture_inventory.py \
            tests/integration/application/*capture*.py \
            tests/conformance/adapters/test_start_catalog_port.py \
            tests/conformance/honesty/test_observation_captured_evidence.py \
            -q --timeout=120 --junitxml="$REPORT_DIR/core.xml" \
            2>&1 | tee "$REPORT_DIR/core.log"
      - name: Host shaped replay storage and diagnostics regressions
        run: |
          set -euo pipefail
          uv run --locked pytest \
            tests/unit/cli/test_observe_hooks.py \
            tests/unit/cli/test_claude_observe_hooks.py \
            tests/unit/cli/test_cursor_observe_hooks.py \
            tests/unit/cli/test_observe_hooks_codex_capture.py \
            tests/unit/cli/test_observe_hooks_native_reservation.py \
            tests/unit/cli/test_observe_hooks_teardown.py \
            tests/unit/cli/test_observe_selection_flow.py \
            tests/unit/cli/test_observe_selection_content_limits.py \
            tests/unit/cli/test_observation_selection_boundary.py \
            tests/unit/cli/test_hook_diagnostics.py \
            tests/unit/cli/test_recovery_membership_races.py \
            tests/unit/adapters/test_codex_session_stream.py \
            tests/unit/domain/test_observation_budget.py \
            tests/integration/storage/test_capture_freeze_barrier.py \
            tests/integration/storage/test_capture_freeze_barrier_races.py \
            tests/integration/storage/test_codex_capture_ticket_sqlite.py \
            tests/integration/storage/test_capture_ticket_consent_cleanup.py \
            -q --timeout=120 --junitxml="$REPORT_DIR/hosts-storage.xml" \
            2>&1 | tee "$REPORT_DIR/hosts-storage.log"
      - name: Build exact candidate without source substitutions
        run: |
          set -euo pipefail
          uv build --no-sources --out-dir "${RUNNER_TEMP}/yoetz-695-dist" \
            2>&1 | tee "$REPORT_DIR/build.log"
          sha256sum "${RUNNER_TEMP}"/yoetz-695-dist/* > "$REPORT_DIR/distribution-sha256.txt"
          uv run --locked python scripts/scan_public_boundary.py --source-tree . \
            --artifact "${RUNNER_TEMP}"/yoetz-695-dist/*.whl \
            --artifact "${RUNNER_TEMP}"/yoetz-695-dist/*.tar.gz \
            2>&1 | tee "$REPORT_DIR/distribution-boundary.log"
      - name: Serialized clean install package parity and import boundaries
        run: |
          set -euo pipefail
          env -u YOETZ_ISOLATED_ROOT uv run --locked pytest \
            tests/packaging/test_build_artifacts.py \
            tests/packaging/test_resource_byte_parity.py \
            tests/packaging/test_resource_ripple.py \
            tests/packaging/test_hook_import_diet.py \
            tests/packaging/test_service_boundary_imports.py \
            tests/packaging/test_clean_install.py \
            -q --timeout=180 --junitxml="$REPORT_DIR/packaging.xml" \
            2>&1 | tee "$REPORT_DIR/packaging.log"
      - name: Publish only the verified dedicated fix branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 92e8d9df1c4cb0c8c4118d83ec4525d994eeb6ea
          test -z "$(git status --porcelain)"
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push origin HEAD:refs/heads/codex/fix-695-capture-recovery
          printf 'published_commit=%s\n' "$(git rev-parse HEAD)" >> "$REPORT_DIR/identity.txt"
      - name: Upload verification evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yoetz-695-capture-recovery-evidence
          path: ${{ runner.temp }}/yoetz-695-report/
          retention-days: 7
          if-no-files-found: warn
