name: Export issue 131 source

on:
  push:
    branches:
      - agent/issue-131-typed-evidence-provenance

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Export full checkout
        run: tar --exclude=.git -czf "${RUNNER_TEMP}/issue-131-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-131-full-source
          path: ${{ runner.temp }}/issue-131-source.tar.gz
          if-no-files-found: error
          retention-days: 1
