name: Apply issue 131 implementation

on:
  push:
    branches:
      - agent/issue-131-typed-evidence-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Locate and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$(find . -type f -name 'issue-131.patch.xz.b64' -print -quit)"
          if [[ -z "${patch_file}" ]]; then
            echo 'issue-131.patch.xz.b64 was not found' >&2
            exit 1
          fi
          base64 --decode "${patch_file}" > /tmp/issue-131.patch.xz
          xz --decompress --stdout /tmp/issue-131.patch.xz > /tmp/issue-131.patch
          git apply --check /tmp/issue-131.patch
          git apply --index /tmp/issue-131.patch

      - name: Remove temporary transfer machinery
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name 'issue-131.patch.xz.b64' -delete
          rm -f .github/workflows/export-issue-131-source.yml
          rm -f .github/workflows/apply-issue-131-patch.yml
          git add -A

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind evidence digests to typed provenance'
          git push origin HEAD:agent/issue-131-typed-evidence-provenance
